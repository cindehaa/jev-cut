<!doctype html>
<html lang="en">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Jev Cut — prompt to Remotion</title>
<style>
  :root { color-scheme: dark; --ink:#F4F1EA; --muted:#8B93A7; --line:#222636; --accent:#7C9CFF; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:#07070b; color:var(--ink); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 72px; }
  h1 { font-size: 32px; letter-spacing:-0.04em; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 22px; max-width: 62ch; line-height:1.5; }
  .row { display:grid; grid-template-columns: 1.1fr .9fr; gap:18px; }
  @media (max-width: 860px) { .row { grid-template-columns: 1fr; } }
  textarea { width:100%; min-height:128px; background:#10131b; color:#fff; border:1px solid var(--line);
    border-radius:14px; padding:14px; font: inherit; resize:vertical; }
  button { margin-top:12px; background:var(--accent); color:#0b1020; border:0; border-radius:999px;
    padding:11px 18px; font-weight:750; cursor:pointer; }
  button[disabled] { opacity:.55; cursor:wait; }
  .clock { font-variant-numeric: tabular-nums; font-size: 42px; letter-spacing:-0.04em; margin: 10px 0 4px; }
  .clock.run { color: var(--accent); }
  .metrics { display:flex; gap:8px; flex-wrap:wrap; margin: 10px 0 16px; }
  .chip { font-size:12px; border:1px solid var(--line); padding:5px 10px; border-radius:999px; color:#c5c9d6; }
  .chip.hot { border-color: var(--accent); color: var(--accent); }
  iframe { width:100%; min-height: 420px; border:1px solid var(--line); border-radius:16px; background:#0b1020; }
  .log { font: 13px ui-monospace, monospace; color:#b7bdd0; background:#10131b; border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; min-height: 120px; white-space: pre-wrap; }
</style>
<body>
<div class="wrap">
  <h1>Jev Cut</h1>
  <p class="sub">Type a brief. Jev picks Remotion components. The clock is wall time to a playable cut.</p>
  <div class="row">
    <div>
      <textarea id="prompt">15-second dark tech launch for Jev Cut: type a prompt, Jev picks Remotion scenes, code renders the MP4. Cool midnight palette, show the loop as steps, end on Get the template.</textarea>
      <button id="go">Generate cut</button>
      <div class="clock" id="clock">0.000s</div>
      <div class="metrics" id="metrics"></div>
      <div class="log" id="log">Ready. Add TYPESAFE_API_KEY on Vercel for live Jev.</div>
    </div>
    <iframe id="frame" title="preview"></iframe>
  </div>
</div>
<script>
  const go = document.getElementById('go');
  const prompt = document.getElementById('prompt');
  const frame = document.getElementById('frame');
  const clock = document.getElementById('clock');
  const metrics = document.getElementById('metrics');
  const log = document.getElementById('log');
  let raf = 0, t0 = 0;
  function tick() {
    clock.textContent = ((performance.now() - t0) / 1000).toFixed(3) + 's';
    raf = requestAnimationFrame(tick);
  }
  go.onclick = async () => {
    go.disabled = true;
    clock.classList.add('run');
    t0 = performance.now();
    cancelAnimationFrame(raf);
    tick();
    log.textContent = 'Calling Jev…';
    metrics.innerHTML = '';
    try {
      const res = await fetch('/api/plan', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ prompt: prompt.value })
      });
      const spec = await res.json();
      if (!res.ok) throw new Error(spec.error || res.statusText);
      cancelAnimationFrame(raf);
      const total = spec.timing?.totalMs ?? Math.round(performance.now() - t0);
      clock.textContent = (total / 1000).toFixed(3) + 's';
      clock.classList.remove('run');
      metrics.innerHTML = [
        ['Jev', spec.timing?.jevMs],
        ['assemble', spec.timing?.assembleMs],
        ['total', spec.timing?.totalMs],
        ['model', spec.meta?.model],
        ['palette', spec.meta?.palette],
      ].map(([k,v], i) => '<span class="chip' + (i===2 ? ' hot' : '') + '">' + k + ' ' + (v ?? '—') + (typeof v === 'number' ? ' ms' : '') + '</span>').join('');
      log.textContent = (spec.clips || []).map(c => c.type + ' @' + c.from).join('\n');
      frame.srcdoc = spec.previewHtml || '';
    } catch (e) {
      cancelAnimationFrame(raf);
      clock.classList.remove('run');
      log.textContent = String(e.message || e);
    } finally {
      go.disabled = false;
    }
  };
</script>
</body></html>
